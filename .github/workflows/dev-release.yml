# Every push to DEV leaves a release behind.
#
# The dev channel is served straight from the branch, so without this a dev
# build exists only as a zip in the tree and an entry in update-dev.json - and
# there is no way to get at an earlier one. The release is that copy.
#
# The tag is the version from plugin.json, so pushing the same version again
# refreshes the zip on the release that is already there instead of failing on a
# tag that is taken. Bump the version in plugin.json to start a new one.
#
# Every name here is read from plugin.json rather than written down. It was
# written down, as pelican-essentials, and the plugin was renamed to essentials
# in 2.53 - so from 2.53.4-dev onwards this failed on a file that no longer had
# that name, and made no release at all. It failed loudly, in a place nobody was
# looking, which is the same as failing quietly. A name derived from the
# manifest cannot drift from the build that produced it.
name: Dev release

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          # Two, so the notes step can look past a commit that is only the
          # built zip. One is the default and it is what made eleven releases
          # say "release artefacts" and nothing else.
          fetch-depth: 2

      # The one place a real parse always happens.
      #
      # The machine this plugin is built on has no PHP, so tools/lint-php.js is
      # a character scanner and tools/check-parse.js quietly does nothing there.
      # This runner has PHP 8.3 in the image, which makes it the only step in
      # the whole chain that is PHP's own opinion rather than a guess about it.
      #
      # It cannot stop a bad build reaching the dev channel - that is served
      # from the branch and the push has already happened by the time this runs
      # - and it is still worth having: the release is refused, and the failure
      # arrives within a minute rather than whenever somebody opens the page
      # the fatal is on. The build machine gets the same check the moment
      # anybody puts php on its PATH.
      - name: Ask PHP whether it parses
        run: |
          php --version | head -1
          node tools/check-parse.js

      - name: Read the manifest
        id: manifest
        run: |
          version="$(jq -r '.version' plugin.json)"
          id="$(jq -r '.id' plugin.json | tr '[:upper:]' '[:lower:]')"
          name="$(jq -r '.name' plugin.json)"

          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "plugin.json has no version." >&2
            exit 1
          fi

          # The build names its zip after the lowercased id, which is also the
          # folder Pelican installs into. Without an id there is nothing to look
          # for and guessing would put us back where this started.
          if [ -z "$id" ] || [ "$id" = "null" ]; then
            echo "plugin.json has no id." >&2
            exit 1
          fi

          [ -n "$name" ] && [ "$name" != "null" ] || name="$id"

          {
            echo "version=$version"
            echo "id=$id"
            echo "name=$name"
          } >> "$GITHUB_OUTPUT"

      - name: Publish the dev build
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.manifest.outputs.version }}
          ID: ${{ steps.manifest.outputs.id }}
          NAME: ${{ steps.manifest.outputs.name }}
        run: |
          built="release/${ID}-dev.zip"

          if [ ! -f "$built" ]; then
            echo "No dev build committed at $built - run build.ps1 -Dev before pushing." >&2
            echo "Files that are there:" >&2
            ls -1 release/ >&2 || true
            exit 1
          fi

          # The version carries its own channel now - 2.47.1-dev - so the tag is
          # the version rather than the version with -dev put on it again. The
          # other branch is for a manifest that predates the scheme.
          case "$VERSION" in
            *-dev) tag="v${VERSION}" ;;
            *)     tag="v${VERSION}-dev" ;;
          esac

          # Named for its version, so a downloaded zip says what it is once it
          # is out of the browser.
          asset="${ID}-${tag#v}.zip"
          cp "$built" "$asset"

          if gh release view "$tag" >/dev/null 2>&1; then
            # Same version, new build: replace the zip and leave the notes as
            # they are - they may have been written by hand.
            gh release upload "$tag" "$asset" --clobber
            echo "Refreshed $tag"
            exit 0
          fi

          # The commit message, without the trailers on the end of it. Those say
          # who wrote the change and belong to the history; a release note says
          # what changed. The change log in the panel strips them again when it
          # draws a note, because this only cleans up the releases cut after it.
          notes="$(git log -1 --pretty=%B | sed -E '/^[A-Za-z][A-Za-z-]*-[Bb]y: /d')"

          # Unless the last commit is only the built zip.
          #
          # A build cannot run until its new files are staged, so it is easy to
          # end up committing the change, building, and committing the zip after
          # it - at which point HEAD says "2.76.1-dev release artefacts" and so
          # does the release, and so does the change log in everybody's panel.
          # Eleven of them did, and then nine more said "Build 3.99.0-dev",
          # because the test used to be the subject line and a subject line is
          # whatever somebody typed that day.
          #
          # So the question is what the commit touched. A commit that changes
          # nothing but the release archive and the channel manifest is a build
          # and cannot be anything else, whatever it is called. The one before
          # it is the one that says what changed.
          only_build() {
            changed="$(git show --pretty=format: --name-only "$1" | sed '/^$/d')"

            [ -n "$changed" ] || return 1

            printf '%s\n' "$changed" | grep -qvE '^(release/|update(-[a-z]+)?\.json$|plugin\.json$)' && return 1

            return 0
          }

          if only_build HEAD; then
            notes="$(git log -1 --skip=1 --pretty=%B | sed -E '/^[A-Za-z][A-Za-z-]*-[Bb]y: /d')"
          fi

          gh release create "$tag" "$asset" \
            --target dev \
            --prerelease \
            --title "${tag} - ${NAME}" \
            --notes "$notes"

          echo "Created $tag"
