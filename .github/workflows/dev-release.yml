# Every push to DEV leaves a release behind.
#
# The dev channel is served straight from the branch, so without this a dev
# build exists only as a zip in the tree and an entry in update-dev.json - and
# there is no way to get at an earlier one. The release is that copy.
#
# The tag is the version from plugin.json, so pushing the same version again
# refreshes the zip on the release that is already there instead of failing on a
# tag that is taken. Bump the version in plugin.json to start a new one.
name: Dev release

on:
  push:
    branches: [DEV]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Read the manifest
        id: manifest
        run: |
          version="$(jq -r '.version' plugin.json)"

          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "plugin.json has no version." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish the dev build
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.manifest.outputs.version }}
        run: |
          built='release/pelican-essentials-dev.zip'

          if [ ! -f "$built" ]; then
            echo "No dev build committed at $built - run build.ps1 -Dev (or ./build.sh --dev) before pushing." >&2
            exit 1
          fi

          # The version carries its own channel now - 2.47.1-dev - so the tag is
          # the version rather than the version with -dev put on it again. The
          # other branch is for a manifest that predates the scheme.
          case "$VERSION" in
            *-dev) tag="v${VERSION}" ;;
            *)     tag="v${VERSION}-dev" ;;
          esac
          # Named for its version, so a downloaded zip says what it is once it
          # is out of the browser.
          asset="pelican-essentials-${tag#v}.zip"
          cp "$built" "$asset"

          if gh release view "$tag" >/dev/null 2>&1; then
            # Same version, new build: replace the zip and leave the notes as
            # they are - they may have been written by hand.
            gh release upload "$tag" "$asset" --clobber
            echo "Refreshed $tag"
            exit 0
          fi

          # The commit message, without the trailers on the end of it. Those say
          # who wrote the change and belong to the history; a release note says
          # what changed. The change log in the panel strips them again when it
          # draws a note, because this only cleans up the releases cut after it.
          notes="$(git log -1 --pretty=%B | sed -E '/^[A-Za-z][A-Za-z-]*-[Bb]y: /d')"

          gh release create "$tag" "$asset" \
            --target DEV \
            --prerelease \
            --title "${tag} — Pelican Essentials" \
            --notes "$notes"

          echo "Created $tag"
